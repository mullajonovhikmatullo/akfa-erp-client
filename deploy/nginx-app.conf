map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the host's Caddy reaches this port (via the Docker gateway); take the
    # client IP from its X-Forwarded-For so the API's per-IP limits work.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Resolve through Docker DNS at request time so a recreated backend
    # container (new IP) is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 8m;

    location = /store {
        try_files /store/index.html =404;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    }

    location = /platform {
        return 301 /platform/;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /store/assets/ {
        alias /usr/share/nginx/html/store/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /platform/assets/ {
        alias /usr/share/nginx/html/platform/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /store/ {
        alias /usr/share/nginx/html/store/;
        try_files $uri $uri/ /store/index.html;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    }

    location /platform/ {
        alias /usr/share/nginx/html/platform/;
        try_files $uri $uri/ /platform/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
